<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counting Buddy</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" id="stars"></div>
  <main class="game">
    <div class="game-head">
      <h2>-counting buddy</h2>
      <div class="score-pill">⭐ <span id="score">0</span></div>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="game-stage">
      <canvas id="cv" width="320" height="320"></canvas>
    </div>
    <p id="prompt" style="margin-top:10px;font-size:16px;font-weight:700;text-align:center">How many treats?</p>
    <div id="treats" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px"></div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../../js/characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
